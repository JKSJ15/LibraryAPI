spring.application.name=com

spring.web.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://localhost:3306/library
spring.datasource.username=root
spring.datasource.password=adimin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initializationFailTimeout=60000

logging.level.org.springframework.security=DEBUG

api.security.token.secret=qualquercoisa

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

springdoc.swagger-ui.path=/library-doc
springdoc.api-docs.path=/library-api-docs

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=library-api
management.endpoint.prometheus.enabled=true